name: Restore Full Lessons Knowledge Base

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check lesson count
        id: check
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('lessons.json')); print(len(d['lessons']))")
          echo "lesson_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Current lesson count: $COUNT"

      - name: Restore lessons.json
        if: steps.check.outputs.lesson_count != '1239'
        run: python3 fix_lessons.py

      - name: Commit and push restored lessons.json
        if: steps.check.outputs.lesson_count != '1239'
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Sonnet 4.6"
          git add lessons.json
          git rm --ignore-unmatch fix_lessons.py missing_lessons.json patterns.json
          git diff --staged --stat
          git commit -m 'Fix lessons.json: restore full 1239-lesson knowledge base'
          git push
